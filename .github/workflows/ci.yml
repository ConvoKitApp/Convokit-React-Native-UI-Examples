name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check out React Native SDK
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/Convokit-React-Native-SDK
          path: vendor/react-native-sdk
          persist-credentials: false
      - name: Check out React Native UI
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/Convokit-React-Native-UI
          path: vendor/react-native-ui
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm install --no-save --legacy-peer-deps ./vendor/react-native-sdk ./vendor/react-native-ui
      - name: Build React Native SDK
        run: npm run build --prefix vendor/react-native-sdk
      - name: Build React Native UI
        run: npm run build --prefix vendor/react-native-ui
      - run: npm run typecheck
      - run: test -f apps/bare/ios/Podfile
      - run: test -f apps/bare/android/gradlew
